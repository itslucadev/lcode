name: LCode macOS Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcode-macos-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'itslucadev/lcode' &&
      github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: lcode-release
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: itslucadev/lcode
      T3CODE_DESKTOP_APP_ID: dev.itslucadev.lcode
      T3CODE_DESKTOP_ARTIFACT_NAME: LCode-${version}-${arch}.${ext}
      # Upstream's native passkeys require their team's domain association.
      T3CODE_MACOS_PASSKEYS_DISABLED: "true"
    steps:
      - name: Check signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY \
            APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name in the lcode-release environment."
              exit 1
            fi
          done
          [[ "$(uname -m)" == arm64 ]]

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve independent LCode version
        id: version
        run: echo "version=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: >-
            --filter=@t3tools/desktop... --filter=t3...
            --filter=@t3tools/scripts...

      - name: Setup native build toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build JavaScript bundles with release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run build:desktop
          node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Package, sign and notarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/lcode-notarization.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          export APPLE_API_KEY="$key_path"
          vp run dist:desktop:artifact \
            --platform mac --target dmg --arch arm64 \
            --build-version "$VERSION" --skip-build --signed

      - name: Verify signature, notarization and update assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/lcode-release-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" \
            "release/LCode-$VERSION-arm64.dmg"
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          app="$mount/LCode (Beta).app"
          plist="$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          team="$(codesign -dv --verbose=4 "$app" 2>&1 |
            awk -F= '/^TeamIdentifier=/{print $2}')"
          [[ "$team" == "$EXPECTED_TEAM" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' \
            "$plist")" == dev.itslucadev.lcode ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            "$plist")" == "$VERSION" ]]
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          mkdir release-publish
          cp "release/LCode-$VERSION-arm64.dmg" release-publish/
          cp "release/LCode-$VERSION-arm64.zip" release-publish/
          cp release/latest-mac.yml release-publish/
          for extension in dmg.blockmap zip.blockmap; do
            asset="release/LCode-$VERSION-arm64.$extension"
            if [[ -f "$asset" ]]; then cp "$asset" release-publish/; fi
          done
          node scripts/verify-lcode-release.ts release-publish "$VERSION" \
            "$app/Contents/Resources/app-update.yml"

      - name: Upload only verified public release assets
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lcode-macos-release
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Download verified assets
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lcode-macos-release
          path: assets

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install GitHub CLI wrapper
        run: npm install --global gh-axi@0.1.44 --ignore-scripts

      - name: Publish an immutable LCode release
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.0\.[1-9][0-9]*$ ]]
          latest="$(gh-axi api \
            '/repos/itslucadev/lcode/releases?per_page=100' --jq \
            '[.[] | select(.draft == false and .prerelease == false) |
              .tag_name | select(test("^v0\\.0\\.[0-9]+\\+lcode$")) |
              ltrimstr("v0.0.") | rtrimstr("+lcode") | tonumber] |
              max // 0')"
          [[ "$latest" =~ ^[0-9]+$ ]]
          if (( latest >= GITHUB_RUN_NUMBER )); then
            echo '::error::A same or newer LCode release already exists.'
            exit 1
          fi
          notes="$RUNNER_TEMP/lcode-release-notes.md"
          {
            echo "LCode $VERSION for Apple Silicon Macs."
            echo
            echo 'Install the DMG once; later versions use the app updater.'
            echo 'Keep the update channel set to Latest, not Nightly.'
            echo
            echo "Source commit: $RELEASE_SHA"
          } > "$notes"
          # A separate tag namespace avoids the fork's inherited T3 tags.
          tag="v$VERSION+lcode"
          gh-axi api POST /repos/itslucadev/lcode/git/refs \
            --raw-field "ref=refs/tags/$tag" --raw-field "sha=$RELEASE_SHA"
          gh-axi release create "$tag" -R itslucadev/lcode \
            --verify-tag --title "LCode $VERSION" \
            --notes-file "$notes" --draft assets/*
          gh-axi release edit "$tag" -R itslucadev/lcode \
            --draft=false --latest=true
          echo "Published LCode $VERSION." >> "$GITHUB_STEP_SUMMARY"
