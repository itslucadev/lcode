name: LCode Upstream Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcode-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'itslucadev/lcode' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a token that triggers PR checks
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo '::error::Set UPSTREAM_SYNC_TOKEN; see the setup guide.'
            echo 'It needs Contents, Pull requests and Workflows write access.'
            echo 'The default GITHUB_TOKEN cannot trigger PR checks.'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install GitHub CLI wrapper
        working-directory: ${{ runner.temp }}
        run: npm install --global gh-axi@0.1.44 --ignore-scripts

      # Never execute code from the fetched upstream tree in this job.
      - name: Prepare upstream PR
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          script="$RUNNER_TEMP/lcode-upstream-sync.cjs"
          cp .github/scripts/lcode-upstream-sync.cjs "$script"
          node "$script"

      - name: Publish analysis
        if: always()
        run: |
          report="$RUNNER_TEMP/lcode-upstream-report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve analysis on failure
        if: failure()
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lcode-upstream-analysis
          path: ${{ runner.temp }}/lcode-upstream-report.md
          if-no-files-found: ignore
          retention-days: 14
